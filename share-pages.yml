name: Páginas para compartir

# Genera una página por producto (con foto y precio) para que los links compartidos
# muestren la vista previa. Se actualiza sola cada 15 minutos y también se puede
# ejecutar a mano desde la pestaña Actions → "Páginas para compartir" → Run workflow.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate-share-pages.mjs'
      - '.github/workflows/share-pages.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas desde el catálogo
        run: node tools/generate-share-pages.mjs

      - name: Guardar cambios
        run: |
          git config user.name "soldit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A p sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualizar páginas para compartir"
            git pull --rebase
            git push
            echo "HUBO_CAMBIOS=1" >> "$GITHUB_ENV"
          fi

      # Los commits hechos por una automatización no siempre disparan la publicación del sitio:
      # se pide explícitamente.
      - name: Pedir la publicación del sitio
        if: env.HUBO_CAMBIOS == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
